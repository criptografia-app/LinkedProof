<!DOCTYPE html>
<html>

<head>
    <title>CRIPTOGRAFIA</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            padding: 16px;
            font-size: 14px;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 16px 0;
            color: #00ff00;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 span {
            font-weight: normal;
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }

        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        input:focus {
            outline: none;
            border-color: #00ff00;
        }

        button {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button.primary {
            background: #00ff00;
            color: #000;
            border: none;
        }

        button:hover {
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }

        #history_list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item .date {
            font-size: 11px;
            color: #666;
        }

        .history-item a {
            color: #00ff00;
            text-decoration: none;
            font-size: 12px;
        }

        .history-item a:hover {
            text-decoration: underline;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.active {
            background: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }

        .empty-state {
            text-align: center;
            color: #444;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>
        <span>🔐</span> CRIPTOGRAFIA
        <span id="settings_toggle">⚙️ Settings</span>
    </h1>

    <!-- LOGIN / SETTINGS -->
    <div id="settings_panel" class="card hidden">
        <label>GitHub token (saves your proofs as public Gists):</label>
        <div style="font-size: 11px; color: #888; margin-bottom: 8px; line-height: 1.5;">
            <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" style="color:#00ff00">Create a fine-grained token</a>
            with one permission: <b>Account &rarr; Gists: Read and write</b>. No repository access.
        </div>
        <input type="password" id="token" placeholder="github_pat_...">
        <button id="save" class="primary">Save Configuration</button>
        <div id="status_msg" style="margin-top:8px; color:#00ff00; display:none; font-size:12px;">Saved!</div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard_panel">
        <div class="card" style="display:flex; align-items:center;">
            <div id="connection_status" class="status-dot"></div>
            <div id="connection_text">Checking...</div>
        </div>

        <label>RECENT GIST PROOFS</label>
        <div class="card" style="min-height: 100px;">
            <ul id="history_list">
                <!-- Items injected here -->
            </ul>
            <div id="empty_history" class="empty-state">No signatures yet</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
